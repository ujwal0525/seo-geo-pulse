name: Update feed

on:
  schedule:
    # every 4 hours (UTC). Change the cron to go faster/slower.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual refreshes

# let the job commit the refreshed data.json back to the repo
permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Aggregate feeds
        run: python aggregate.py

      - name: Commit refreshed data
        run: |
          git config user.name  "seo-geo-pulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --quiet --cached; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh feed $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
