<style>

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
.wrap{max-width:760px; margin:0 auto; padding:0 20px}

/* ── masthead ─────────────────────────────────────────────── */
.masthead{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.2) blur(8px);
  border-bottom:1px solid var(--hair);
}
.masthead-inner{
  display:flex; align-items:flex-start; justify-content:space-between; gap:16px;
  padding:16px 20px 14px;
}
.brand{display:flex; align-items:center; gap:9px}
.live-dot{position:relative; width:9px; height:9px; border-radius:50%; background:var(--live); flex:none}
.live-dot::after{
  content:""; position:absolute; inset:-5px; border-radius:50%;
  border:1.5px solid var(--live); opacity:.5;
  animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite;
}
@keyframes ping{0%{transform:scale(.6);opacity:.6}80%,100%{transform:scale(1.7);opacity:0}}
.wordmark{font-family:var(--display); font-weight:700; font-size:19px; letter-spacing:-.01em}
.tagline{font-size:12.5px; color:var(--muted); margin-top:4px; max-width:44ch}
.sync{font-family:var(--mono); font-size:11.5px; color:var(--faint); text-align:right; white-space:nowrap; padding-top:3px}
.sync b{color:var(--muted); font-weight:500}
.sync .sep{opacity:.4; margin:0 5px}

/* ── platform timeline ────────────────────────────────────── */
.timeline{padding:14px 0 10px; border-bottom:1px solid var(--hair-2)}
.tl-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:11px; flex-wrap:wrap}
.tl-title{font-family:var(--mono); font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink)}
.tl-legend{display:flex; gap:13px; font-family:var(--mono); font-size:10px; color:var(--faint)}
.lg{display:inline-flex; align-items:center; gap:5px}
.lg::before{content:""; width:7px; height:7px; border-radius:50%}
.lg-engine::before{background:var(--cat-content)}
.lg-model::before{background:var(--cat-ai)}
.tl-rail{display:flex; overflow-x:auto; padding-bottom:6px; scrollbar-width:thin}
.tl-item{position:relative; flex:0 0 176px; padding:15px 16px 2px 0}
.tl-item::before{content:""; position:absolute; top:5px; left:0; right:0; height:2px; background:var(--hair)}
.tl-item:first-child::before{left:8px}
.tl-item:last-child::before{right:calc(100% - 8px)}
.tl-dot{position:absolute; top:1px; left:3px; width:10px; height:10px; border-radius:50%; background:var(--tl-c,var(--faint)); border:2px solid var(--surface)}
.tl-engine{--tl-c:var(--cat-content)}
.tl-model{--tl-c:var(--cat-ai)}
.tl-date{font-family:var(--mono); font-size:10px; color:var(--faint)}
.tl-plat{font-family:var(--mono); font-size:10px; font-weight:500; color:var(--tl-c,var(--muted)); margin-top:2px}
.tl-label{font-size:12.5px; line-height:1.3; margin-top:3px; color:var(--ink); padding-right:14px}
.tl-label a{text-decoration:none}
.tl-label a:hover{text-decoration:underline; text-underline-offset:2px; text-decoration-color:var(--tl-c)}

/* ── controls ─────────────────────────────────────────────── */

.search{

.filters{display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-top:11px}
.chip{

  background:var(--surface); color:var(--muted);
  border:1px solid var(--hair); border-radius:999px; padding:5px 11px;

.chip:hover{border-color:var(--faint)}

.cat-seo{--c:var(--cat-content)} .cat-geo{--c:var(--cat-ai)} .cat-algo{--c:var(--cat-algo)}

.selects{display:flex; gap:7px; margin-left:auto}
select.mini{

@media (max-width:560px){

  .sync{text-align:left}
  .tl-item{flex-basis:150px}
  .selects{margin-left:0; width:100%}

// Priority = static impact (from the aggregator) blended with live recency, so a
// high-impact story stays near the top for a few days while trivia decays fast.
const GRAVITY = 1.5;
function priorityScore(it){
  const impact = (typeof it.impact === "number") ? it.impact : 1;
  const ageDays = Math.max(0, (Date.now() - new Date(it.published).getTime()) / 864e5);
  return impact / Math.pow(ageDays + 2, GRAVITY);
}
const HIGH_IMPACT = 6;   // stories at/above this get a "high impact" flag

// ── helpers ─────────────────────────────────────────────────
function timeAgo(iso){
  if(!iso) return "";
  const then=new Date(iso), now=new Date(), s=(now-then)/1000;
  if(isNaN(s)) return "";
  if(s<90) return "just now";
  const m=s/60; if(m<60) return Math.round(m)+"m ago";
  const h=m/60; if(h<24) return Math.round(h)+"h ago";
  const d=h/24; if(d<7) return Math.round(d)+"d ago";
  return then.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}
function fmtDateTime(iso){
  const d=new Date(iso); if(isNaN(d)) return "";
  return d.toLocaleString(undefined,{day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"});
}
function isNew(iso){ const t=new Date(iso); return !isNaN(t) && (Date.now()-t)/36e5 < 48; }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// ── render ──────────────────────────────────────────────────
function renderSync(){
  const el=document.getElementById("sync");
  const n=state.items.length;
  let when;
  if(state.usingSeed) when = "Sample data — refreshes on first sync";
  else if(state.updated) when = "Last refreshed "+fmtDateTime(state.updated)+" · "+timeAgo(state.updated);
  else when = "Awaiting first sync";
  el.innerHTML = `<b>${n}</b> ${n===1?"story":"stories"}<span class="sep">·</span>${esc(when)}`;
}

function renderTimeline(){
  const box=document.getElementById("timeline"), rail=document.getElementById("tlRail");
  let ms=(state.milestones||[]).slice();
  if(!ms.length){ box.style.display="none"; return; }
  box.style.display="";
  ms.sort((a,b)=> a.date<b.date?1:-1);          // newest first
  ms=ms.slice(0,30).reverse();                   // 30 most recent, oldest → newest (left → right)
  rail.innerHTML=ms.map(m=>{
    const fam=(m.family==="engine")?"tl-engine":"tl-model";
    const d=new Date((m.date||"")+"T00:00:00");
    const dstr=isNaN(d)?esc(m.date||""):d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
    const label=m.url?`<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.title)}</a>`:esc(m.title);
    return `<div class="tl-item ${fam}">
      <div class="tl-dot"></div>
      <div class="tl-date">${dstr}</div>
      <div class="tl-plat">${esc(m.platform||"")}</div>
      <div class="tl-label">${label}</div>
    </div>`;
  }).join("");
  requestAnimationFrame(()=>{ rail.scrollLeft=rail.scrollWidth; });   // open at the most recent (right edge)
}

function renderFilters(){
  const box=document.getElementById("filters"); box.innerHTML="";
  const all=document.createElement("button");
  all.className="chip"+(state.cats.size===0?" on":""); all.type="button"; all.textContent="All";
  all.onclick=()=>{ state.cats.clear(); render(); };
  box.appendChild(all);
  CAT_ORDER.forEach(cat=>{
    const c=CATS[cat], b=document.createElement("button");
    b.className="chip "+c.cls+(state.cats.has(cat)?" on":""); b.type="button";
    b.innerHTML=`<span class="dot"></span>${c.short}`;
    b.onclick=()=>{ state.cats.has(cat)?state.cats.delete(cat):state.cats.add(cat); render(); };
    box.appendChild(b);
  });
  const wrap=document.createElement("div"); wrap.className="selects";
  const src=document.createElement("select"); src.className="mini"; src.setAttribute("aria-label","Filter by source");
  const sources=[...new Set(state.items.map(i=>i.source))].sort();
  src.innerHTML=`<option value="all">All sources</option>`+sources.map(s=>`<option value="${esc(s)}"${state.source===s?" selected":""}>${esc(s)}</option>`).join("");
  src.onchange=e=>{ state.source=e.target.value; render(); };
  const sort=document.createElement("select"); sort.className="mini"; sort.setAttribute("aria-label","Sort stories");
  sort.innerHTML=`<option value="top">Top</option><option value="new">Newest</option><option value="old">Oldest</option><option value="source">By source</option>`;
  sort.value=state.sort;
  sort.onchange=e=>{ state.sort=e.target.value; render(); };
  wrap.appendChild(src); wrap.appendChild(sort); box.appendChild(wrap);
}

function currentList(){
  let list=state.items.slice();
  if(state.cats.size) list=list.filter(i=>state.cats.has(i.category));
  if(state.source!=="all") list=list.filter(i=>i.source===state.source);
  if(state.q){
    const q=state.q.toLowerCase();
    list=list.filter(i=>(i.title+" "+i.summary+" "+i.source).toLowerCase().includes(q));
  }
  if(state.sort==="new") list.sort((a,b)=>a.published<b.published?1:-1);
  else if(state.sort==="old") list.sort((a,b)=>a.published<b.published?-1:1);
  else if(state.sort==="source") list.sort((a,b)=>a.source.localeCompare(b.source)||(a.published<b.published?1:-1));
  else list.sort((a,b)=>priorityScore(b)-priorityScore(a));   // "top" (default)
  return list;
}

function renderFeed(){
  const feed=document.getElementById("feed"), empty=document.getElementById("empty");
  const list=currentList();
  if(!list.length){ feed.innerHTML=""; empty.style.display="block"; return; }
  empty.style.display="none";
  feed.innerHTML=list.map(it=>{
    const c=CATS[it.category]||CATS["Industry"];
    const highImpact = (typeof it.impact==="number" && it.impact>=HIGH_IMPACT);
    const impactBadge = highImpact?`<span class="badge-impact">HIGH&nbsp;IMPACT</span><span class="m-sep">·</span>`:"";
    const newBadge=isNew(it.published)?`<span class="badge-new">NEW</span><span class="m-sep">·</span>`:"";
    const cov=(it.coverage&&it.coverage>=2)?`<span class="m-sep">·</span><span class="card-cov">${it.coverage} sources</span>`:"";
    return `<article class="card ${c.cls}">
      <div class="card-meta">${impactBadge}${newBadge}<span class="card-cat">${esc(c.short)}</span>
        <span class="m-sep">·</span><span>${esc(it.source)}</span>${cov}
        <span class="m-sep">·</span><span title="${esc(fmtDateTime(it.published))}">${esc(timeAgo(it.published))}</span>
        <span class="m-sep">·</span><span class="card-date">${esc(fmtDateTime(it.published))}</span></div>
      <h3 class="card-title"><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a></h3>
      ${it.summary?`<p class="card-summary">${esc(it.summary)}</p>`:""}
    </article>`;
  }).join("");
}

function renderFooter(){
  document.getElementById("footCadence").textContent =
    state.usingSeed ? "Feed refreshes every ~4 hours once deployed." : "Feed refreshes every ~4 hours.";
  const sources=[...new Set(state.items.map(i=>i.source))].sort();
  document.getElementById("sourceList").innerHTML =
    sources.map(s=>`<b>${esc(s)}</b>`).join(`<span> · </span>`);
}

function render(){ renderSync(); renderFilters(); renderFeed(); renderFooter(); }

// ── boot ────────────────────────────────────────────────────
async function boot(){
  let data=null;
  try{ const r=await fetch("./data.json",{cache:"no-store"}); if(r.ok) data=await r.json(); }catch(e){}
  if(!data || !Array.isArray(data.items) || data.items.length===0){ data=SEED_DATA; state.usingSeed=true; }
  state.items=data.items; state.updated=data.updated;
  state.milestones=(data.milestones && data.milestones.length)?data.milestones:SEED_MILESTONES;
  document.getElementById("search").addEventListener("input",e=>{ state.q=e.target.value.trim(); renderFeed(); });
  document.getElementById("clearBtn").addEventListener("click",()=>{
    state.q=""; state.cats.clear(); state.source="all"; document.getElementById("search").value=""; render();
  });
  render();
  renderTimeline();
}
boot();
</script>
</body>
</html>
